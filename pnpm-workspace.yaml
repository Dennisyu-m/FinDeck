packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher and POSIX flock binding are developed with their
  # harness consumers but keep their native build and publication scripts
  # under native/system.
  - native/system
  - native/system/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  - website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

overrides:
  'extract-zip>yauzl': '3.4.0'
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # mdast-util-from-markdown and micromark-extension-gfm resolved
  # micromark-util-types 2.0.2 while the rest of the graph resolved 2.0.3. The
  # package is types-only, but two copies make ContainerState/TokenTypeMap
  # nominally incompatible, failing the client build with TS2769 in
  # packages/client/ui-primitives/src/markdown/parse.ts.
  'micromark-util-types': '2.0.3'
  # app-builder-lib 26.15.3 reads `ElectronDownloadCacheMode` from @electron/get,
  # which only 3.1.0 and later export; its `^3.0.0` range alone leaves pnpm on
  # 3.0.0, and the Electron download then dies with `Cannot read properties of
  # undefined (reading 'ReadWrite')`.
  'app-builder-lib>@electron/get': '3.1.0'
  # The packaged runtime closure is a flat (hoisted) tree, and the profile
  # module fallback mirrors it by package name. `content-type` therefore has to
  # be one version for everyone: `negotiator` 1.1.0 requires `^2.1.0` while
  # express and the MCP SDK keep a nested `1.0.5`, and whichever the mirror
  # picks, the other consumer breaks -- in practice the web server then throws
  # `invalid media type` on the first request carrying `Accept-Encoding`.
  # Pinning negotiator to its dependency-free 0.x line, which is what express's
  # own `accepts` and `compression` use, removes the three-way conflict.
  'negotiator': '0.6.4'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) genuinely
# needs its.
allowBuilds:
  esbuild: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
  # The desktop shell's runtime; its postinstall downloads the prebuilt
  # Electron binary for this platform.
  electron: true
  # electron-builder's Squirrel.Windows helper. The desktop installer ships the
  # NSIS target only, so this platform-specific packer never runs.
  electron-winstaller: false

minimumReleaseAgeExclude:
  # Office engines and their API are qualified and released together by the kit
  # repository. The fork installs the API plus its win32-x64 native engine and
  # the platform-independent WASM fallback; the darwin/win32-arm64 engine
  # packages stay unlisted because this fork neither builds nor ships for them.
  - '@deepseek-ai/libreoffice-kit@0.1.1'
  - '@deepseek-ai/libreoffice-kit-wasm@0.1.1'
  - '@deepseek-ai/libreoffice-kit-win32-x64@0.1.1'
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@0.87.1'
  - node-addon-native-custom-loader@0.1.6
  - node-addon-require-builtin-darwin-arm64@0.1.6
  - node-addon-require-builtin-darwin-x64@0.1.6
  - node-addon-require-builtin-linux-arm64-gnu@0.1.6
  - node-addon-require-builtin-linux-x64-gnu@0.1.6
  - node-addon-require-builtin-win32-arm64-msvc@0.1.6
  - node-addon-require-builtin-win32-ia32-msvc@0.1.6
  - node-addon-require-builtin-win32-x64-msvc@0.1.6
  - node-addon-require-builtin@0.1.6
  # The active pnpm supply-chain policy blocks this reviewed runtime closure
  # until its release-age window expires unless every exact package is exempt.
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk@0.3.263'
  # All platform aliases resolve to the @openai/codex package name, so their
  # reviewed exact versions must share one version-union policy entry.
  - '@openai/codex@0.153.4||0.153.4-darwin-arm64||0.153.4-darwin-x64||0.153.4-linux-arm64||0.153.4-linux-x64||0.153.4-win32-arm64||0.153.4-win32-x64'

patchedDependencies:
  # Streaming tool-call arguments were re-parsed from the whole accumulated JSON
  # on every delta, making a multi-MB argument stream O(n²) (earendil-works/pi#9265).
  # The patch drops those per-delta parses; `toolcall_end` still parses the final
  # buffer, so only the mid-stream `partial.content[i].arguments` snapshot changes.
  '@earendil-works/pi-ai@0.87.1': patches/@earendil-works__pi-ai@0.87.1.patch
  '@yao-pkg/pkg@6.21.0': patches/@yao-pkg__pkg@6.21.0.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
