[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-runtime-bin"
version = "1.0.0-alpha.1"
description = "Bundled dsh CLI runtime for the FinDeck Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dennisyu" }]

[project.urls]
Homepage = "https://github.com/Dennisyu-m/FinDeck"
Documentation = "https://github.com/Dennisyu-m/FinDeck/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/Dennisyu-m/FinDeck/issues"
Source = "https://github.com/Dennisyu-m/FinDeck"

[project.scripts]
dsh = "deepseek_harness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/deepseek_harness_runtime/runtime/deepseek-harness-sdk-runtime-*"]
exclude = ["src/deepseek_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
